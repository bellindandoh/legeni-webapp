---
- name: Créer le dossier de Jenkins
  ansible.builtin.file:
    path: "{{ jenkins_dir }}"
    state: directory
    mode: "0755"

- name: Copier le Dockerfile et la liste de plugins (image du TP 3.1)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ jenkins_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - Dockerfile
    - plugins.txt
  notify: Reconstruire et relancer Jenkins

- name: Générer le docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Reconstruire et relancer Jenkins

- name: Lire le groupe propriétaire du socket Docker
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_sock

- name: Écrire DOCKER_GID dans .env (accès au socket sans chmod 666)
  ansible.builtin.copy:
    content: "DOCKER_GID={{ docker_sock.stat.gid }}\n"
    dest: "{{ jenkins_dir }}/.env"
    mode: "0644"
  notify: Reconstruire et relancer Jenkins

- name: Appliquer les handlers en attente avant de démarrer
  ansible.builtin.meta: flush_handlers

- name: Construire (si besoin) et démarrer Jenkins
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_dir }}"
    build: policy
    state: present

- name: Attendre que Jenkins réponde
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_http_port }}/login"
    status_code: [200, 403]
  register: jenkins_up
  until: jenkins_up.status in [200, 403]
  retries: 30
  delay: 10
  changed_when: false
