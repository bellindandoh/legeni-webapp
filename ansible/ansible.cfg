[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
# Le mot de passe Vault n'est PAS déclaré ici : on le passe avec --vault-password-file
# (sinon la moindre commande ansible échouerait quand .vault_pass est absent, par exemple en CI).

[ssh_connection]
pipelining = True
